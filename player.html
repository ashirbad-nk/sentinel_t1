<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sentinel Timelapse — Live Build</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0d1117; color:#e6edf3; font-family:system-ui,sans-serif; }
  .wrap { display:flex; height:100vh; }
  .stage { flex:1; display:flex; align-items:center; justify-content:center; background:#000; }
  img { max-height:100%; max-width:100%; object-fit:contain; }
  .side { width:340px; padding:16px; overflow-y:auto; border-left:1px solid #30363d; }
  h1 { font-size:16px; margin:0 0 12px; }
  .bar { height:10px; background:#21262d; border-radius:5px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:#2ea043; width:0%; transition:width .4s; }
  .stat { font-size:13px; color:#8b949e; margin:4px 0; }
  button, input { font:inherit; }
  button { background:#238636; color:#fff; border:0; padding:8px 14px; border-radius:6px; cursor:pointer; }
  button:hover { background:#2ea043; }
  .row { display:flex; align-items:center; gap:10px; margin:12px 0; }
  input[type=range] { flex:1; }
  .date { font-size:22px; font-weight:600; margin:10px 0; }
  .log { font:11px monospace; color:#8b949e; white-space:pre-wrap; word-break:break-all;
         background:#161b22; padding:8px; border-radius:6px; max-height:300px; overflow-y:auto; }
  .pill { display:inline-block; background:#21262d; padding:2px 8px; border-radius:10px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage"><img id="view" alt="waiting for frames..."></div>
  <div class="side">
    <h1>Sentinel Timelapse — Live Build</h1>
    <div class="date" id="date">—</div>
    <div class="stat" id="cloud" style="font-size:15px;color:#d29922">cloud: —</div>
    <div class="stat" id="progress">loading…</div>
    <div class="bar"><div id="barfill"></div></div>
    <div class="stat" id="eta"></div>
    <div class="stat" id="years"></div>
    <div class="row">
      <button id="play">Pause</button>
      <span class="pill" id="fpslabel">10 fps</span>
    </div>
    <div class="row"><span>fps</span><input id="fps" type="range" min="1" max="30" value="10"></div>
    <div class="row"><input id="scrub" type="range" min="0" max="0" value="0"></div>
    <div class="log" id="log"></div>
  </div>
</div>
<script>
const view = document.getElementById('view');
const dateEl = document.getElementById('date');
const prog = document.getElementById('progress');
const barfill = document.getElementById('barfill');
const etaEl = document.getElementById('eta');
const yearsEl = document.getElementById('years');
const logEl = document.getElementById('log');
const scrub = document.getElementById('scrub');
const fps = document.getElementById('fps');
const fpslabel = document.getElementById('fpslabel');
const playBtn = document.getElementById('play');

let frames = [], idx = 0, playing = true, timer = null, clouds = {};
fetch('/frames/clouds.json', {cache:'no-store'}).then(r => r.json()).then(d => clouds = d).catch(()=>{});

async function poll() {
  try {
    const s = await (await fetch('/api/status', {cache:'no-store'})).json();
    const old = frames.length;
    frames = s.frames;
    if (frames.length !== old) {
      scrub.max = Math.max(0, frames.length - 1);
      if (idx >= frames.length) idx = Math.max(0, frames.length - 1);
    }
    const pct = s.total ? (s.done / s.total * 100) : 0;
    barfill.style.width = pct.toFixed(1) + '%';
    prog.textContent = `${s.done} / ${s.total} frames  •  ${s.discarded} discarded  •  ${s.errors} errors`;
    const m = Math.floor(s.eta_seconds / 60), sec = s.eta_seconds % 60;
    etaEl.textContent = `ETA ~${m}m ${sec}s  •  ~${s.avg_seconds_per_frame}s/frame × ${s.workers} workers  •  updated ${s.updated}`;
    yearsEl.textContent = Object.entries(s.by_year).map(([y,c]) => `${y}:${c}`).join('   ');
    logEl.textContent = s.recent.slice(-25).reverse().join('\n');
    if (frames.length && !timer) { show(); schedule(); }
  } catch (e) { prog.textContent = 'server error: ' + e; }
}

function show() {
  if (!frames.length) return;
  if (idx >= frames.length) idx = frames.length - 1;
  const name = frames[idx];
  view.src = '/frames/' + name + '.jpg?' + Date.now();
  dateEl.textContent = name;
  document.getElementById('cloud').textContent =
    'cloud (whole tile): ' + (clouds[name] != null ? clouds[name] + '%' : '—');
  scrub.value = idx;
}
function schedule() {
  clearTimeout(timer);
  if (playing && frames.length) {
    timer = setTimeout(() => { idx = (idx + 1) % frames.length; show(); schedule(); }, 1000 / +fps.value);
  }
}
playBtn.onclick = () => {
  playing = !playing;
  playBtn.textContent = playing ? 'Pause' : 'Play';
  if (playing) schedule(); else clearTimeout(timer);
};
fps.oninput = () => { fpslabel.textContent = fps.value + ' fps'; schedule(); };
scrub.oninput = () => { idx = +scrub.value; show(); };

poll();
setInterval(poll, 4000);
</script>
</body>
</html>
