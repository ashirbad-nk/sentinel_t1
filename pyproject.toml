[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-tool"
version = "0.1.0"
description = "Monsoon-resilient crop & field monitoring toolkit over India using open Sentinel satellite data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "dask>=2024.1",
    "scipy>=1.11",
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "stackstac>=0.5",
    "pillow>=10.0",
    "astral>=3.2",
    "h5py>=3.10",
    "h5netcdf>=1.3",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
